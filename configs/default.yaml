# NADIP default configuration

data:
  window: 50
  stride: 10
  max_3w_instances: 300
  apply_nigerian_aug: true
  seed: 42

model:
  d_model: 128
  nhead: 4
  num_layers: 3
  dropout: 0.1

training:
  epochs: 40
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  max_grl_lambda: 1.0
  lambda_dom: 0.5
  lambda_con: 0.1

evaluation:
  primary_real_facility: "3w_offshore_well"
  metrics:
    - auprc
    - rul_rmse
    - mmd
    - wasserstein1
